server:
  port: 8083

spring:
  application:
    name: entra-resource-server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          audiences: ${AZURE_API_AUDIENCE:api://${AZURE_API_CLIENT_ID}}

logging:
  level:
    org.springframework.security: INFO
