server:
  port: 8086

spring:
  application:
    name: method-security-rs
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8090/realms/demo/protocol/openid-connect/certs}
          issuer-uri: ${ISSUER_URI:http://localhost:8090/realms/demo}

logging:
  level:
    org.springframework.security: INFO
