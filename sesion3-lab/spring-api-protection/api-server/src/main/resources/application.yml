server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12

spring:
  application:
    name: api-protection-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# CORS restrictivo por entorno (ver application-dev.yml / application-prod.yml)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8198}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT}
  max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

# Rate limiting Bucket4j + Redis (diapositiva: 100 auth / 20 publico por minuto).
# Para demo en vivo, baja los valores con variables de entorno.
ratelimit:
  authenticated:
    capacity: ${RATELIMIT_AUTH_CAPACITY:100}
    refill-period-seconds: 60
  public:
    capacity: ${RATELIMIT_PUBLIC_CAPACITY:20}
    refill-period-seconds: 60

security:
  api-key: ${API_KEY:demo-user}

logging:
  level:
    com.example.demo: INFO
