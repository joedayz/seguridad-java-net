services:
  redis:
    image: redis:7-alpine
    container_name: api-protection-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  api-server:
    build: ./api-server
    container_name: api-protection-server
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: "http://localhost:8198"
      API_KEY: demo-user
      # Valores bajos para provocar 429 en demo (diapositiva: 100/20).
      RATELIMIT_AUTH_CAPACITY: "10"
      RATELIMIT_PUBLIC_CAPACITY: "5"
    ports:
      - "8443:8443"

  client-app:
    image: nginx:alpine
    container_name: api-protection-client
    volumes:
      - ./clients:/usr/share/nginx/html:ro
      - ./clients/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8198:80"
