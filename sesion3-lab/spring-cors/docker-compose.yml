services:
  cors-server:
    build: ./cors-server
    container_name: cors-server
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:8193,http://localhost:8195"
      CORS_ALLOWED_METHODS: "GET,POST"
      CORS_MAX_AGE_SECONDS: "3600"
    ports:
      - "8183:8183"

  # Clientes estaticos (origenes distintos para ver CORS en el navegador).
  client-app:
    image: nginx:alpine
    container_name: cors-client-app
    volumes:
      - ./clients:/usr/share/nginx/html:ro
      - ./clients/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8193:80"

  client-admin:
    image: nginx:alpine
    container_name: cors-client-admin
    volumes:
      - ./clients:/usr/share/nginx/html:ro
      - ./clients/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8195:80"

  client-blocked:
    image: nginx:alpine
    container_name: cors-client-blocked
    volumes:
      - ./clients:/usr/share/nginx/html:ro
      - ./clients/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8196:80"
