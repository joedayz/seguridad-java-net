services:
  vault:
    image: hashicorp/vault:1.15
    container_name: spring-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    container_name: spring-vault-postgres
    environment:
      POSTGRES_USER: vault-admin
      POSTGRES_PASSWORD: vault-admin-pass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault-admin -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Configura Vault una sola vez: motor de BD, rol dinamico (TTL 1h) y AppRole.
  vault-init:
    image: hashicorp/vault:1.15
    container_name: spring-vault-init
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-token"
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-spring-app-role-id}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-spring-app-secret-id}
    volumes:
      - ./vault:/vault-init:ro
    entrypoint: ["/bin/sh", "/vault-init/setup.sh"]
    restart: "no"

  app:
    build: ./app
    container_name: spring-vault-app
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      VAULT_URI: "http://vault:8200"
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-spring-app-role-id}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-spring-app-secret-id}
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/appdb"
    ports:
      - "8086:8086"
