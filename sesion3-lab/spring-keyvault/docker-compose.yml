services:
  postgres:
    image: postgres:16
    container_name: spring-vault-postgres
    environment:
      POSTGRES_USER: vault-admin
      POSTGRES_PASSWORD: vault-admin-pass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault-admin -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Vault en modo dev que se AUTOCONFIGURA al arrancar (ver vault/entrypoint.sh):
  # habilita el motor "database", crea el rol dinamico (TTL 1h) y el AppRole.
  # El healthcheck solo pasa cuando la configuracion termino, asi la app espera.
  vault:
    image: hashicorp/vault:1.15
    container_name: spring-vault
    depends_on:
      postgres:
        condition: service_healthy
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TOKEN: "dev-token"
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-spring-app-role-id}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-spring-app-secret-id}
    ports:
      - "8200:8200"
    volumes:
      - ./vault:/vault-init:ro
    entrypoint: ["/bin/sh", "/vault-init/entrypoint.sh"]
    healthcheck:
      # Healthy solo cuando el AppRole ya existe => configuracion completada.
      test: ["CMD", "vault", "read", "auth/approle/role/spring-app/role-id"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: ./app
    container_name: spring-vault-app
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      VAULT_URI: "http://vault:8200"
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-spring-app-role-id}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-spring-app-secret-id}
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/appdb"
    ports:
      - "8086:8086"
