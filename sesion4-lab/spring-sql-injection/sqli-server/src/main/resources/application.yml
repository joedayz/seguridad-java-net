server:
  port: 8181

spring:
  application:
    name: sqli-server
  datasource:
    # Base de datos H2 en memoria: la demo arranca sin instalar nada.
    url: jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      # Ejecuta schema.sql y data.sql al arrancar para sembrar los usuarios.
      mode: always

logging:
  level:
    com.example.demo: INFO
